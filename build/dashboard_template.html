<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拉美销售预测达成看板</title>
<style>
:root{
  --bg:#f1f4fa; --panel:#ffffff; --ink:#15203a; --ink2:#3e4d6d; --muted:#77869f;
  --line:#e4e9f3; --line2:#f0f3f9;
  --accent:#2f5bd7; --accent2:#4f8ef7; --accent-soft:#eaf0fe;
  --up:#d93b3b; --up-soft:#fdeeee;
  --down:#159b66; --down-soft:#e9f7f0;
  --warn:#cf8a15; --warn-soft:#fdf4e4;
  --radius:14px;
  --shadow:0 1px 2px rgba(21,32,58,.05), 0 10px 28px -16px rgba(21,32,58,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
html{scroll-behavior:smooth}
.wrap{max-width:1520px;margin:0 auto;padding:20px 24px 60px}
section.block{scroll-margin-top:var(--nav-gap,96px)}
.cols{display:grid;grid-template-columns:206px minmax(0,1fr);column-gap:20px;align-items:start}
.cols>.main{min-width:0}
.cols>.sidenav{position:sticky;top:96px;align-self:start;
  display:flex;flex-direction:column;gap:2px;padding:15px 12px 12px;
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);max-height:calc(100vh - 96px);overflow:auto}
.sidenav .navh{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);
  font-weight:700;letter-spacing:1.6px;padding:2px 12px 11px}
.sidenav .navh::after{content:'';flex:1;height:1px;background:var(--line2)}
.sidenav .navi{position:relative;display:flex;align-items:baseline;gap:10px;padding:10px 12px;
  border-radius:10px;cursor:pointer;color:var(--ink2);font-size:14px;line-height:1.4;
  text-decoration:none;transition:background .15s,color .15s;user-select:none}
.sidenav .navi:hover{background:#f4f7fd;color:var(--accent)}
.sidenav .navi .nn{flex:none;min-width:19px;font-size:12px;font-weight:600;letter-spacing:.4px;
  color:#9fadc2;font-variant-numeric:tabular-nums}
.sidenav .navi .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidenav .navi.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sidenav .navi.on .nn{color:var(--accent)}
.sidenav .navi.on::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:4px;height:19px;border-radius:0 4px 4px 0;background:var(--accent)}
.sidenav .navi.up{margin-top:9px;padding-top:12px;border-radius:0;border-top:1px solid var(--line2);
  color:var(--muted);font-size:13.5px;justify-content:center}
.sidenav .navi.up:hover{background:transparent;color:var(--accent)}
/* ---------- topbar ---------- */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:6px 2px 18px;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2f5bd7,#5b9bff);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px;
  box-shadow:0 8px 18px -8px rgba(47,91,215,.7)}
h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.2px}
.sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.meta .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink2);box-shadow:var(--shadow)}
.meta .pill b{color:var(--ink)}
/* ---------- filters ---------- */
.filters{position:sticky;top:0;z-index:30;background:rgba(241,244,250,.92);backdrop-filter:blur(10px);
  padding:12px 0 12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.frow{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.fgroup{display:flex;align-items:center;gap:10px}
.fgroup>label{font-size:12px;color:var(--muted);letter-spacing:.5px;white-space:nowrap}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:9px;
  padding:6px 12px;font-size:13px;cursor:pointer;transition:.16s;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip:hover{border-color:#c3d0ea;background:#fbfcff}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 6px 14px -8px rgba(47,91,215,.9)}
.chip .tiny{font-size:11px;opacity:.75;margin-left:5px}
#periodSel{font-size:13px;font-weight:600;color:var(--ink);padding:7px 12px;border-radius:9px;
  border:1px solid var(--line);background:#fff;min-width:158px;cursor:pointer;font-variant-numeric:tabular-nums}
#periodSel:hover{border-color:#c3d0ea;background:#fbfcff}
.sites-grid.one{grid-template-columns:repeat(2,minmax(300px,1fr))}
/* 单站点：趋势面板占满整行（面板宽度变化后由 JS 重算 SVG 内部宽度） */
.trend-grid.one{grid-template-columns:1fr}
@media (max-width:820px){.sites-grid.one,.trend-grid.one{grid-template-columns:1fr}}
.drillbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;min-height:0}
.drillbar .dchip{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);border:1px solid #cfdcfb;
  color:#22409b;border-radius:9px;padding:5px 10px;font-size:12.5px}
.drillbar .dchip b{font-weight:600}
.drillbar .dchip i{cursor:pointer;font-style:normal;font-size:14px;line-height:1;opacity:.7}
.drillbar .dchip i:hover{opacity:1}
.drillbar .reset{background:#fff;border:1px dashed #c9d3e6;color:var(--muted);border-radius:9px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.drillbar .reset:hover{color:var(--up);border-color:#f0c0c0}
/* ---------- 宽表（多维指标表） ---------- */
.tscroll{overflow-x:auto;margin:0 6px;border:1px solid var(--line2);border-radius:10px;background:#fff}
table.wide{table-layout:fixed;width:100%;min-width:1924px;border-collapse:separate;border-spacing:0}
table.wide th,table.wide td{padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
table.wide thead th{background:#f5f8fd;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink);font-weight:700}
table.wide thead tr:first-child th.grp{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink);
  letter-spacing:.4px;border-right:1px solid #e6ecf7}
table.wide thead tr:nth-child(2) th{font-size:10px;line-height:1.35;background:#fafcff;white-space:normal;
  word-break:break-word;vertical-align:bottom;text-align:center;color:var(--ink);font-weight:700}
table.wide thead tr:nth-child(2) th.sorted .hsub{color:#6c86bd}
table.wide tbody td{font-size:12.5px;color:var(--ink2)}
table.wide td.rc,table.wide td.num,table.wide thead th.num{text-align:center}
table.wide tbody tr:hover td{background:#f7f9fe}
table.wide tbody tr.on td{background:var(--accent-soft)}
table.wide .stk{position:sticky;background:#fff;z-index:2}
table.wide .c-rank{left:0;text-align:center;color:var(--muted);font-size:12px}
/* 固定列偏移由列宽推导（--lka/--lk1/--lk2 写在 table 行内，拖动改宽后实时更新） */
table.wide .c-name{left:var(--lk1,38px);border-right:1px solid var(--line);color:var(--ink)}
table.wide .c-name2{left:var(--lk2,170px);border-right:1px solid var(--line);color:var(--ink)}
/* 名称列前的附属列（可多列：国家Listing 表 1 列、SKU 表 2 列），全部固定且与名称列同字体 */
table.wide .c-name3{left:var(--lka,38px);border-right:1px solid var(--line)}
table.wide .c-name4{left:var(--lka2,156px);border-right:1px solid var(--line)}
/* 列宽拖拽手柄 */
table.wide thead th:not(.stk){position:relative}
table.wide thead th .rz{position:absolute;top:0;right:-4px;width:9px;height:100%;z-index:7;cursor:col-resize}
table.wide thead th .rz:hover,table.wide thead th .rz.on{background:linear-gradient(to right,transparent 3px,var(--accent) 3px,var(--accent) 5px,transparent 5px)}
body.colrz{cursor:col-resize}
body.colrz *{cursor:col-resize!important;user-select:none!important}
/* 可排序表头：点一下从高到低，再点一下从低到高（默认订单销量从高到低） */
table.wide thead th.sortable{cursor:pointer;transition:background .15s,color .15s}
table.wide thead th.sortable:hover{background:#e9f1fd;color:var(--accent)}
table.wide thead th.sortable .sk{display:inline-block;width:11px;margin-left:3px;font-size:9px;font-style:normal;
  line-height:1;vertical-align:middle;color:#bcc9dc;font-weight:700}
table.wide thead th.sortable:hover .sk{color:var(--accent)}
table.wide thead th.sortable.sorted{background:#e6eefc;color:var(--accent)}
table.wide thead th.sortable.sorted .sk{color:var(--accent)}
table.wide tbody .c-name,table.wide tbody .c-name2,table.wide tbody .c-name3,table.wide tbody .c-name4{font-weight:600;color:var(--ink)}
table.wide td.c-name3 .auxn{color:var(--muted);font-size:10.5px}
table.wide thead .stk{z-index:5;background:#f1f5fc}
table.wide tbody tr:hover .stk{background:#f7f9fe}
table.wide tbody tr.on .stk{background:#e4edfd}
.g-rate,.th-rate{background:#f7faff}
.g-val,.th-val{background:#fcfdff}
.g-gap,.th-gap{background:#fdfaf5}
.g-band,.th-band{background:#f7fcf9}
table.wide tbody tr:hover .g-rate,table.wide tbody tr:hover .g-val,
table.wide tbody tr:hover .g-gap,table.wide tbody tr:hover .g-band{background:#f7f9fe}
table.wide tbody tr.on .g-rate,table.wide tbody tr.on .g-val,
table.wide tbody tr.on .g-gap,table.wide tbody tr.on .g-band{background:var(--accent-soft)}
.rchip{display:inline-block;min-width:54px;text-align:center;border-radius:6px;padding:2px 7px;font-size:12.5px;font-weight:600}
.rchip.t1{background:#b3271f;color:#fff;box-shadow:inset 0 0 0 1px #8f1d17}   /* ≥110% 实心深红 */
.rchip.t2{background:#fbe0dd;color:#cf3b30}                                   /* 100~110% 浅底红 */
.rchip.t3{background:#fdefd2;color:#a9761a}                                   /* 90~100% 浅底橙 */
.rchip.t4{background:#dff2e7;color:#1c8e5c}                                   /* 80~90% 浅底绿 */
.rchip.t5{background:#12794f;color:#fff;box-shadow:inset 0 0 0 1px #0d5f3e}   /* <80% 实心绿 */
.rchip.none{background:#f4f6fb;color:#a6b1c4}
.rchip.lg{min-width:0;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600}
.gapv{font-weight:600}
/* 缺口 = 预测 − 实际：正值=未达成（与达成率色阶一致用绿），负值=超出（用红） */
.gapv.gapup{color:#12855a} .gapv.gapdown{color:#c94a4a} .gapv.gapzero{color:#9aa7bd}
/* ---------- block ---------- */
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.block-head{padding:15px 18px 13px;border-bottom:1px solid var(--line2);display:flex;gap:16px;
  align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.btitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bnum{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  font-size:12px;font-weight:700;display:grid;place-items:center}
.btitle h2{margin:0;font-size:15.5px;font-weight:700}
.btitle .cnt{font-size:12px;color:var(--muted);background:#f4f6fb;border-radius:6px;padding:2px 7px}
.btitle .scoped{font-size:12px;color:#22409b;background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.bmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mtag{font-size:12.5px;color:var(--muted);background:#f7f9fd;border:1px solid var(--line2);border-radius:8px;padding:4px 10px}
.mtag b{color:var(--ink);font-variant-numeric:tabular-nums}
select,input[type=search]{font-family:inherit;font-size:12.5px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;outline:none;cursor:pointer}
select:focus,input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(79,142,247,.16)}
input[type=search]{cursor:text;width:150px}
.block-body{padding:10px 10px 14px}
/* ---------- composition bar ---------- */
.compline{display:flex;align-items:center;gap:10px;margin:12px 8px 14px}
.comp-lbl{flex:0 0 auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.comp{flex:1;display:flex;gap:2px;height:26px;min-width:0}
.comp .seg{border-radius:5px;overflow:hidden;display:grid;place-items:center;min-width:3px;transition:.2s}
.comp .seg span{font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;font-weight:500}
/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:6px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.3px}
thead th.num{text-align:right}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .14s}
tbody tr:hover{background:#f7f9fe}
tbody tr.on{background:var(--accent-soft)}
tbody tr.on td{border-bottom-color:#dbe5fb}
td.rank{color:var(--muted);font-size:12px;width:34px}
td.name{font-weight:600;color:var(--ink);max-width:260px}
td.name .nm{display:inline-flex;align-items:center;gap:6px}
td.num{text-align:right;color:var(--ink2)}
td.num b{color:var(--ink);font-weight:600}
.share{display:flex;align-items:center;gap:7px}
.share .track{flex:1;height:7px;border-radius:4px;background:#eef2f9;overflow:hidden;min-width:52px}
.share .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#4f8ef7,#2f5bd7)}
.share .txt{font-size:12px;color:var(--muted);width:44px;text-align:right}
.delta{font-weight:600;font-size:12.5px;white-space:nowrap}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:#9aa7bd;font-weight:500}
.more{padding:10px 12px 4px;display:flex;justify-content:center}
.more button{font-family:inherit;background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:7px 18px;font-size:13px;color:var(--accent);cursor:pointer;transition:.16s}
.more button:hover{background:var(--accent-soft);border-color:#cfdcfb}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
/* ---------- 自定义列 ---------- */
.block-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.expbtn{cursor:pointer;background:#f0f4fa;border:1px solid #d0d8e0;border-radius:5px;padding:3px 10px;font-size:12px;color:#4a5568}
.expbtn:hover{background:#dce6f4}
table.wide[data-hide~="mRate"] [data-c="mRate"]{display:none}
table.wide[data-hide~="m1Rate"] [data-c="m1Rate"]{display:none}
table.wide[data-hide~="wRate"] [data-c="wRate"]{display:none}
table.wide[data-hide~="mOosRate"] [data-c="mOosRate"]{display:none}
table.wide[data-hide~="wOosRate"] [data-c="wOosRate"]{display:none}
table.wide[data-hide~="f4"] [data-c="f4"]{display:none}
table.wide[data-hide~="f3"] [data-c="f3"]{display:none}
table.wide[data-hide~="f1"] [data-c="f1"]{display:none}
table.wide[data-hide~="a"] [data-c="a"]{display:none}
table.wide[data-hide~="f5"] [data-c="f5"]{display:none}
table.wide[data-hide~="mGap"] [data-c="mGap"]{display:none}
table.wide[data-hide~="mOosGap"] [data-c="mOosGap"]{display:none}
table.wide[data-hide~="wGap"] [data-c="wGap"]{display:none}
table.wide[data-hide~="wOosGap"] [data-c="wOosGap"]{display:none}
table.wide[data-hide~="f1q"] [data-c="f1q"]{display:none}
table.wide[data-hide~="f4q"] [data-c="f4q"]{display:none}
table.wide[data-hide~="bandShare"] [data-c="bandShare"]{display:none}
table.wide[data-hide~="bandShare4"] [data-c="bandShare4"]{display:none}
.colbtn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12px;color:var(--ink2);
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;transition:.15s}
.colbtn:hover{border-color:#b9c8e2;color:var(--accent)}
.colbtn.on{border-color:#9db4e0;background:var(--accent-soft);color:var(--accent);font-weight:600}
.colbtn b{font-weight:700}
.colpop{position:absolute;z-index:80;width:242px;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 16px 40px -12px rgba(21,32,58,.34);padding:11px 12px 10px}
.colpop[hidden]{display:none}
.colpop .cph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.colpop .cph b{font-size:13px;color:var(--ink)}
.colpop .cph em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.colpop .csearch{width:100%;box-sizing:border-box;font-family:inherit;font-size:12px;color:var(--ink2);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;margin-bottom:7px;outline:none}
.colpop .csearch:focus{border-color:#9db4e0;box-shadow:0 0 0 2px var(--accent-soft)}
.colpop .cplist{max-height:308px;overflow:auto;border:1px solid var(--line2);border-radius:9px;padding:2px}
.colpop .cpgrp{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.6px;padding:7px 9px 3px}
.colpop .cpitem{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:7px;cursor:pointer;
  font-size:12.5px;color:var(--ink2)}
.colpop .cpitem:hover{background:#f5f8ff}
.colpop .cpitem input{accent-color:var(--accent);margin:0;cursor:pointer;flex:none}
.colpop .cpf{display:flex;align-items:center;gap:4px;margin-top:9px}
.colpop .cpf button{font-family:inherit;font-size:12px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:5px 6px;cursor:pointer;transition:.15s;flex:0 0 auto}
.colpop .cpf button:hover{border-color:#9db4e0;color:var(--accent);background:var(--accent-soft)}
.colpop .cpf button.pri{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.colpop .cpf button.pri:hover{background:#2549b8;color:#fff}
/* 「应用/全局」两字一行：每行独立成块且禁止换行，避免按钮变窄时被拆成一字一行 */
.colpop .cpf button .cgl{display:block;white-space:nowrap;line-height:1.32}
/* ---------- 表头筛选 ---------- */
table.wide .c-name .cnm{display:inline-block;vertical-align:middle}
.fbtn{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin-left:6px;
  padding:1px 5px;border:1px solid #d5dfef;border-radius:6px;background:#fff;color:#8494ae;
  font-family:inherit;font-size:10px;font-weight:600;line-height:1.55;cursor:pointer;transition:.15s}
.fbtn:hover{border-color:#9db4e0;color:var(--accent)}
.fbtn.on{border-color:#9db4e0;background:var(--accent-soft);color:var(--accent)}
.fbtn b{font-weight:700}
.fpop{position:absolute;z-index:80;width:254px;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 16px 40px -12px rgba(21,32,58,.34);padding:11px 12px 10px}
.fpop[hidden]{display:none}
.fpop .fph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.fpop .fph b{font-size:13px;color:var(--ink)}
.fpop .fph em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.fpop .fsearch{width:100%;box-sizing:border-box;font-family:inherit;font-size:12px;color:var(--ink2);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;margin-bottom:7px;outline:none}
.fpop .fsearch:focus{border-color:#9db4e0;box-shadow:0 0 0 2px var(--accent-soft)}
.fpop .flist{max-height:232px;overflow:auto;border:1px solid var(--line2);border-radius:9px;padding:3px}

/* ---------- KPI ---------- */

  color:var(--muted);letter-spacing:.3px}
.subhead::after{content:'';flex:1;height:1px;background:var(--line2)}
.subhead.noline::after{display:none}
.subhead .sp{flex:1;height:1px;background:var(--line2)}
.subhead select{font-size:12.5px;font-weight:600;color:var(--ink);padding:5px 10px;border-radius:8px;

.subhead b{color:var(--ink2);font-weight:600}
.sites-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding:12px 16px 4px}

.scard:hover{border-color:#c3d0ea;transform:translateY(-1px);box-shadow:var(--shadow)}
.scard.on{border-color:var(--accent);background:linear-gradient(180deg,#f3f7ff,#fff);box-shadow:0 0 0 3px rgba(47,91,215,.1)}
.scard .sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.scard .sname{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.flag{width:22px;height:16px;border-radius:3px;display:grid;place-items:center;font-size:9px;color:#fff;font-weight:700;letter-spacing:.3px}
.scard .sline{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.scard .big{font-size:26px;font-weight:700;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.scard .unit{font-size:12px;color:var(--muted)}
.sstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}
.sstat{background:#f8fafd;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;min-width:0}
.sstat .sl{display:block;font-size:11px;line-height:1.38;color:var(--muted);min-height:30px}
.sstat .sv{display:block;font-size:15.5px;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums;margin-top:1px}
@media (max-width:560px){.sstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- matrix ---------- */
.matrix{padding:8px 16px 16px}
.matrix table{font-size:12.8px}
.matrix thead th{text-align:right;font-size:11.5px}
.matrix thead th:first-child,.matrix thead th:nth-child(2){text-align:left}
.matrix tbody td{text-align:right;cursor:default}
.matrix tbody td:first-child,.matrix tbody td:nth-child(2){text-align:left}
.matrix tbody tr:hover{background:#fafcff}
.matrix th.grp{text-align:center;border-left:1px solid var(--line2);color:var(--ink2)}
.cell-rate{font-weight:600}
/* ---------- insights ---------- */
.insights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 16px 4px}
@media (max-width:900px){.insights{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.insights{grid-template-columns:1fr}}
.icard{background:linear-gradient(180deg,#fbfcff,#fff);border:1px solid var(--line2);border-left:3px solid var(--accent2);
  border-radius:10px;padding:11px 13px}

.icard .ihf{margin-left:auto;font-size:10.5px;color:#a6b1c4;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard .irk{flex:0 0 auto;width:16px;height:16px;border-radius:5px;background:#eef2f9;color:#7b8aa5;
  font-size:10px;font-weight:700;display:inline-grid;place-items:center;align-self:center}
.icard .rk1{background:#fdeeee;color:#c94a4a}
.icard .il .gapv{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px}
.tag.up{background:var(--up-soft);color:var(--up)} .tag.down{background:var(--down-soft);color:var(--down)}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.neu{background:#eef2f9;color:var(--muted)}
.icard.warn{border-left-color:#e0842c}
.icard.down{border-left-color:#159b66}
/* ---------- trend ---------- */
.trend{padding:6px 16px 16px}
.trend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.tpanel{border:1px solid var(--line2);border-radius:12px;padding:10px 12px 4px;background:#fcfdff}
.tpanel.on{border-color:#d9e3fb;background:#f8fbff}
.tpanel h3{margin:2px 0 0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.tpanel .tleg{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.tleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}

/* 达成率单元格可点：提示可弹出该行趋势 */
table.wide td.rt{cursor:pointer}
table.wide td.rt:hover{background:#eef4ff}
table.wide td.rt:hover .rchip{box-shadow:0 0 0 2px rgba(47,91,215,.28)}
/* ---------- 达成率趋势弹窗 ---------- */
.tpop{position:fixed;inset:0;z-index:90;background:rgba(18,28,48,.36);display:flex;align-items:center;
  justify-content:center;padding:22px}
.tpop[hidden]{display:none}
.tpop .tp-box{background:#fff;border-radius:14px;width:min(1000px,100%);max-height:92vh;overflow:auto;
  padding:15px 18px 16px;box-shadow:0 26px 64px -22px rgba(14,26,50,.55)}
.tpop .tp-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tpop .tp-dim{font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px}
.tpop .tp-nm{font-size:15.5px;font-weight:700;color:var(--ink)}
.tpop .tp-sub{font-size:12px;font-weight:600;color:var(--muted)}
.tpop .sp{flex:1;min-width:12px}
/* 口径标签：点哪一列的达成率就固定显示哪个口径，不给下拉切换 */
.tpop .tp-metric{flex:none;font-size:12.5px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border:1px solid #cfdcfb;border-radius:8px;padding:4px 11px}
.tpop .tp-x{flex:none;width:29px;height:29px;border:1px solid var(--line);background:#fff;border-radius:9px;
  font-size:13px;line-height:1;cursor:pointer;color:var(--muted);font-family:inherit}
.tpop .tp-x:hover{background:#f4f7fd;color:var(--accent);border-color:#cfdcfb}
.tpop .tleg{margin-top:5px}
.tpop #tpChart{margin-top:2px}
/* Q4 名称点击 → 表格式的预测达成（行=周期，列=各口径）
   列宽交给浏览器按内容自适应 + 表头不折行：11 列固定 px 很难算准，长表头容易掉字换行。 */
.tpop .tp-box.tp-wide{width:min(1280px,100%)}
.tpop .tp-tblwrap{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:64vh}
table.tp-tbl{width:100%;border-collapse:separate;border-spacing:0;
  font-size:12.5px;font-variant-numeric:tabular-nums}
table.tp-tbl thead th{position:sticky;top:0;z-index:2;background:#f4f7fd;color:#44557a;font-weight:700;
  font-size:11.5px;line-height:1.35;padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);
  white-space:normal;text-wrap:balance}   /* 必须显式写回：全局 thead th 是 nowrap，会让整表撑到 max-content 并溢出弹窗；
                                             balance 让窄屏折行时两行均分，避免「成」「量」这类单字尾行 */
table.tp-tbl tbody td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line2);color:var(--ink);
  white-space:nowrap}
table.tp-tbl tbody tr:last-child td{border-bottom:0}
table.tp-tbl tbody tr:nth-child(even){background:#fbfcfe}
table.tp-tbl tbody tr.cur{background:#eef4ff}
table.tp-tbl tbody tr.cur td{font-weight:700}
table.tp-tbl td.tp-p{text-align:left;color:var(--muted);font-weight:600}
table.tp-tbl tbody tr.cur td.tp-p{color:var(--accent)}
table.tp-tbl td.tp-b{color:#44557a;font-weight:600}
.tpop .tp-lg{margin-top:8px}
svg{display:block;width:100%;height:auto}
.bar-lbl{font-size:10.5px;fill:#77869f}
.axis-lbl{font-size:10.5px;fill:#98a5bd}
/* ---------- legend ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);
  padding:10px 18px;border-top:1px solid var(--line2);background:#fbfcfe}
.legend .item{display:flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:4px}
footer{color:var(--muted);font-size:12px;line-height:1.9;padding:6px 4px 0}
footer b{color:var(--ink2)}
footer .fh{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.tip{position:relative}
.tip:hover::after{content:attr(data-tip);position:absolute;left:0;top:100%;z-index:50;background:#15203a;color:#fff;
  font-size:11.5px;padding:5px 9px;border-radius:7px;white-space:pre;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
@media (max-width:1180px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .cols>.sidenav{display:none}
}
@media (max-width:760px){
  .wrap{padding:14px}

}
/* ---------- Q4 冲销异常 ---------- */
/* 筛选栏右侧的快捷入口：显示当前筛选下命中的异常项数，点击跳到 Q4 板块 */
.q4jump{margin-left:auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  border:1px solid #dfe6f5;background:#fff;border-radius:10px;padding:4px 12px;cursor:pointer;
  font-family:inherit;transition:border-color .15s,box-shadow .15s,background .15s;
  box-shadow:0 1px 2px rgba(21,32,58,.04)}

.q4jump .q4j-t{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.q4jump .q4j-t::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.q4jump .q4j-n{font-size:11px;color:var(--muted);white-space:nowrap}

.q4sum{padding:9px 12px 8px;font-size:12px;line-height:1.6;color:var(--muted);

<script>
/* 一个看板装多套数据（周报 / 月报…），靠筛选栏最左侧的「粒度」芯片切换。
   DB.modes[i] 的字段与单期数据完全一致，切粒度 = 整体替换 D，因此模板其余部分无需感知粒度数。 */
const DB = __DATA__;
const DIM_KEYS = ['业务组','BU','产品组','业务负责人','三级分类','国家Listing','SKU'];
const DIM_LABEL = {'业务组':'业务组','BU':'BU','产品组':'产品组','三级分类':'三级分类','业务负责人':'负责人','国家Listing':'国家Listing','SKU':'SKU'};
const FLD = ['w','s','g','b','p','c','o','a','f1','f2','f3','f4','f5','ids','n0','rn','f1q','f4q','l','k'];
const DIDX = {'业务组':'g','BU':'b','产品组':'p','三级分类':'c','业务负责人':'o','国家Listing':'l','SKU':'k'};
const SITE_FLAG = {'Amazon.com.mx.new':{t:'MX',c:'#2f8f4e'},'Amazon.com.br.new':{t:'BR',c:'#1f7a4d'}};
const DEF_TOP = {'业务组':20,'BU':20,'产品组':20,'三级分类':15,'业务负责人':20,'国家Listing':15,'SKU':15};

/* —— 当前生效的粒度数据（loadMode 时整体替换）—— */
let D = null;          // 当前粒度数据：periods / sites / dims / recs / unit / unitName / trendWin / source / filter
let DEOF = {};         // 维度取值 → 下标
let REC = [];          // recs 展开成对象数组
let NREC = 0;
let U = '周';          // 周期单位（「周」/「月」），所有文案都跟着它走
let UNAME = '周报';    // logo 角标
let TWIN = 4;          // 趋势图默认展示最近几个周期
const state = { mode:null,            // 当前粒度 key
                pidx: 0, site:'ALL', bizGroup:'ALL', elim:'ALL', drill:{}, sort:{}, top:{}, hide:{}, hideCols:{}, trendIdx:'mRate',
                hideAux:{},   // 附属列（国家Listing 表的三级分类）局部筛选：dimKey → 排除集合
                colW:{} };    // 自定义列宽：tableKey -> 宽度数组（拖动表头边界调整）
let ELIM_SET = new Set(); // 命中巴西淘汰清单的 SKU 维度下标（loadMode 时计算）

/* —— 文本选择保护 ——
   表格里拖选（或 Ctrl+A 全选）是为了复制数据，不能顺带触发行下钻 / 趋势弹窗。
   判定两条：① 鼠标按下到抬起有明显位移（≥5px，即拖选）② 当前确实存在非空选区。
   注意 `_selBusy` 在 mouseup 里置位、click 紧随其后触发，所以能拦住这次拖选。 */
let _mdX = 0, _mdY = 0, _selBusy = false;
document.addEventListener('mousedown', e=>{ _mdX = e.clientX; _mdY = e.clientY; _selBusy = false; }, true);
document.addEventListener('mouseup', e=>{
  const moved = Math.abs(e.clientX - _mdX) + Math.abs(e.clientY - _mdY);
  let sel = null;
  try { sel = window.getSelection && window.getSelection(); } catch(err) { sel = null; }
  _selBusy = moved >= 5 || !!(sel && !sel.isCollapsed && String(sel).trim());
}, true);
function textSelecting(){
  try {
    const s = window.getSelection && window.getSelection();
    if(s && !s.isCollapsed && String(s).trim()) return true;
  } catch(err) { /* 测试桩无 getSelection */ }
  return _selBusy;
}

/* 装载某个粒度：替换数据与单位文案，并重置与数据相关的筛选状态。
   两个粒度的周期数、维度取值、下钻项都不同，不重置会出现下标越界 / 下钻命中空集。
   列宽 state.colW 与自定义列 state.hideCols 与数据无关，保留。 */
function ctxKey(tblKey){ return `${state.mode}:${state.site}:${state.bizGroup}:${tblKey}`; }
function hideColsSet(tblKey){ const k = ctxKey(tblKey); if(!state.hideCols[k]) state.hideCols[k]=new Set(); return state.hideCols[k]; }
function loadMode(key){
  const modes = DB.modes || [];
  if(!modes.length) throw new Error('数据里没有 modes');
  const m = modes.find(x=>x.key===key) || modes[0];
  state.mode = m.key;
  D = m;
  U = D.unit || '周'; UNAME = D.unitName || (U + '报'); TWIN = D.trendWin || 4;
  DEOF = {}; DIM_KEYS.forEach(k=>{ DEOF[k] = new Map((D.dims[k]||[]).map((v,i)=>[v,i])); });
  REC = D.recs.map(arr=>{ const o={}; FLD.forEach((k,i)=>o[k]=arr[i]); return o; });
  NREC = REC.length;
  /* 预计算：SKU 维度下标 → 是否入选巴西淘汰清单（靠最早SKU 判定）。
     淘汰清单只影响巴西站，天然跟站点绑定 —— 用 BRSITE_idx 来判 */
  let brSiteIdx = -1; for(let i=0;i<D.sites.length;i++){ if(D.sites[i].code==='Amazon.com.br.new') brSiteIdx=i; }
  ELIM_SET.clear();  // 命中淘汰清单的 SKU 维度下标
  if(brSiteIdx>=0 && (DB.elimSkus||[]).length){
    const skus = D.dims['SKU']||[];
    const elimLookup = new Set((DB.elimSkus||[]).map(String));
    for(let i=0;i<skus.length;i++){
      const earliest = skus[i].split('|')[0];
      if(elimLookup.has(earliest)) ELIM_SET.add(i);
    }
  }
  state.pidx = D.periods.length-1;
  state.site = 'ALL'; state.bizGroup = 'ALL'; state.elim = 'ALL'; state.drill = {}; state.hide = {}; state.hideAux = {}; state.top = {}; state.q4more = {}; state.trendIdx = state.trendIdx || 'mRate';
  state.sort = {}; DIM_KEYS.forEach(k=>{ state.sort[k] = {k:'a', dir:-1}; });   // 默认各表都按订单销量从高到低
  state.sort['_site'] = {k:'a', dir:-1};
  document.title = `拉美销售预测达成看板`;
}

/* ---------- helpers ---------- */
const nf0=new Intl.NumberFormat('zh-CN',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1});
function fmtN(v,d){ if(v==null) return '—'; return d? nf1.format(v): nf0.format(v); }
/* 缺口展示：以「实际」为准 —— 实际超出预测加 +，实际少于预测（不足）加 - */
function fmtGap(v){
  if(v==null) return '—';
  if(v>0) return '-'+fmtN(v,1);        // 缺口为正 → 实际卖少了
  if(v<0) return '+'+fmtN(-v,1);       // 缺口为负 → 实际卖超了
  return fmtN(0,1);
}
function fmtK(v){ if(v==null) return '—'; if(Math.abs(v)>=100000) return (v/10000).toFixed(1)+'万'; return nf0.format(Math.round(v)); }
function fmtPct(v,d){ if(v==null||!isFinite(v)) return '—'; return (v*100).toFixed(d===undefined?1:d)+'%'; }
function fmtPP(v){ if(v==null||!isFinite(v)) return '—'; return (v>=0?'+':'')+(v*100).toFixed(1)+'pp'; }
function rateOf(a,b){ return (b>0)? a/b : null; }
function rateTier(r){ if(r==null) return 't3'; if(r>=1.10) return 't1'; if(r>=1.0) return 't2'; if(r>=0.90) return 't3'; if(r>=0.80) return 't4'; return 't5'; }
const prettyName=(k,n)=> (k==='SKU') ? String(n).replace('|',' · ') : String(n);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* 达成率色阶图例（站点板块与各维度板块共用同一份，改色只需改这里） */
const TIER_LEGEND = `<span class="item" style="gap:0">达成率色阶</span>
  <span class="item"><span class="rchip lg t1">≥110%</span></span>
  <span class="item"><span class="rchip lg t2">100~110%</span></span>
  <span class="item"><span class="rchip lg t3">90~100%</span></span>
  <span class="item"><span class="rchip lg t4">80~90%</span></span>
  <span class="item"><span class="rchip lg t5">&lt;80%</span></span>`;
const PALETTE=['#2f5bd7','#4f8ef7','#22a2c9','#12b09a','#7c6df2','#b45de0','#e2626c','#ef8f45','#d8b23c','#7aa93c','#5f7d99','#9aa7bd'];
const OTHER='#ccd4e2';
function periodLabel(i){ const p=D.periods[i]; return p? p.label : '—'; }

/* ---------- selectors ---------- */
function matchDrill(r){
  for(const k in state.drill){
    if(r[DIDX[k]] !== DEOF[k].get(state.drill[k])) return false;
  }
  return true;
}
function recsFor(opts){
  const usePeriod = opts.period===undefined? true : opts.period;
  const pIdx = opts.pIdx===undefined? state.pidx : opts.pIdx;
  const allSites = !!opts.allSites;
  const out=[];
  for(let i=0;i<NREC;i++){
    const r=REC[i];
    if(!allSites && state.site!=='ALL' && r.s!==state.site) continue;
    if(usePeriod && r.w!==pIdx) continue;
    if(state.bizGroup!=='ALL' && r.g!==state.bizGroup) continue;
    if(!matchDrill(r)) continue;
    /* 巴西站淘汰筛选：只影响 SKU 维度（k=rec 中的 SKU 下标），不相当于下钻 */
    if(state.elim!=='ALL'){
      const keep = state.elim==='elim' ? ELIM_SET.has(r.k) : !ELIM_SET.has(r.k);
      if(!keep) continue;
    }
    out.push(r);
  }
  return out;
}
function sumRecs(list){
  const t={a:0,f1:0,f2:0,f3:0,f4:0,f5:0,f1q:0,f4q:0,rows:0,sk:new Set()};
  for(const r of list){
    t.a+=r.a; t.f1+=r.f1; t.f2+=r.f2; t.f3+=r.f3; t.f4+=r.f4; t.f5+=r.f5; t.f1q+=r.f1q; t.f4q+=r.f4q; t.rows+=r.rn;
    for(const id of r.ids) t.sk.add(id);
  }
  return t;
}
/* 明细维度的附属列（国家Listing → 主三级分类）：取当前筛选内订单销量最大的那个分类 */
function dominantAux(list, mainKey, auxKey){
  const mk=DIDX[mainKey], ak=DIDX[auxKey], m=new Map();
  for(const r of list){
    let o=m.get(r[mk]); if(!o){ o=new Map(); m.set(r[mk], o); }
    o.set(r[ak], (o.get(r[ak])||0)+r.a);
  }
  const out=new Map();
  for(const [id,sub] of m){
    let best=null, tot=0;
    for(const [aid,a] of sub){ tot+=a; if(!best || a>best.a) best={aid:aid, a:a}; }
    out.set(id, {name:D.dims[auxKey][best.aid], a:best.a, n:sub.size, tot:tot});
  }
  return out;
}

function groupByDim(list, dimKey){
  const k=DIDX[dimKey], m=new Map();
  for(const r of list){
    const id=r[k]; let o=m.get(id);
    if(!o){ o={id:id, name:D.dims[dimKey][id], a:0,f1:0,f2:0,f3:0,f4:0,f5:0,f1q:0,f4q:0,rows:0,sk:new Set()}; m.set(id,o); }
    o.a+=r.a; o.f1+=r.f1; o.f2+=r.f2; o.f3+=r.f3; o.f4+=r.f4; o.f5+=r.f5; o.f1q+=r.f1q; o.f4q+=r.f4q; o.rows+=r.rn;
    for(const sid of r.ids) o.sk.add(sid);
  }
  for(const o of m.values()) o.n=o.sk.size;
  return [...m.values()];
}

/* ---------- 指标口径（按业务给定定义） ---------- */
const MET = {
  mRate:   o=>rateOf(o.a, o.f4),   // M版达成 = 订单销量 ÷ 销售预测(最新版)
  m1Rate:  o=>rateOf(o.a, o.f3),   // M-1版达成 = 订单销量 ÷ 销售预测(M-1)
  wRate:   o=>rateOf(o.a, o.f1),   // 加权达成 = 订单销量 ÷ 销售预测(加权)
  mOos:    o=>rateOf(o.f5, o.f4),  // M版断货清洗达成率 = 断货清洗-销售预测(最新版) ÷ 销售预测(最新版)
  wOos:    o=>rateOf(o.f2, o.f1),  // 加权断货清洗达成率 = 断货清洗-销售预测 ÷ 销售预测(加权)
  mGap:    o=>o.f4 - o.a,          // M版订单预测缺口 = 销售预测(最新版) − 订单销量
  mOosGap: o=>o.f4 - o.f5,         // M版断货清洗缺口 = 销售预测(最新版) − 断货清洗-销售预测(最新版)
  wGap:    o=>o.f1 - o.a,          // 加权订单预测缺口 = 销售预测(加权) − 订单销量
  wOosGap: o=>o.f1 - o.f2          // 加权断货清洗缺口 = 销售预测(加权) − 断货清洗-销售预测
};
/* 加权版 70%-130% 预测量占比：分子 = 该项 70%-130% 预测量，分母 = **该项自身**的销售预测(加权)
   分母随行变化：站点行除以该站点、业务组行除以该业务组、三级分类行除以该三级分类 */
function bandShare(o){ return bandSelf(o); }
function bandShare4(o){ return bandSelf4(o); }
/* 占当前筛选整体的份额，仅用于 tooltip 参考 */
function bandOverall(o, baseF1){ return (baseF1>0)? o.f1q/baseF1 : null; }
function bandOverall4(o, baseF4){ return (baseF4>0)? o.f4q/baseF4 : null; }
function bandSelf(o){ return (o.f1>0)? o.f1q/o.f1 : null; }
function bandSelf4(o){ return (o.f4>0)? o.f4q/o.f4 : null; }
function tcolor(r){ if(r==null) return 'var(--muted)'; if(r>=1) return 'var(--up)'; if(r>=0.9) return 'var(--warn)'; return 'var(--down)'; }

/* ---------- filters UI ---------- */
function switchMode(key){
  if(state.mode===key) return;
  loadMode(key);
  renderTopMeta(); renderNav(); renderAll();
  try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}
function renderFilters(){
  // 粒度切换（周报 / 月报…）：放最左侧，切换即整体换数据
  const mc=document.getElementById('modeChips');
  mc.innerHTML = (DB.modes||[]).map(m=>
    `<div class="chip ${state.mode===m.key?'on':''}" data-mode="${esc(m.key)}" title="${esc(m.filter||'')}">${esc(m.name||m.unitName||m.key)}</div>`
  ).join('');
  mc.querySelectorAll('.chip').forEach(el=>el.onclick=()=>switchMode(el.dataset.mode));

  document.getElementById('logoTag').textContent = UNAME;
  document.getElementById('periodLab').textContent = U;
  const psel=document.getElementById('periodSel');
  psel.innerHTML = D.periods.map((p,i)=>
    `<option value="${i}" ${i===state.pidx?'selected':''}>${p.label}${i===D.periods.length-1?'（最新）':''}</option>`
  ).reverse().join('');
  psel.value = String(state.pidx);
  psel.onchange = ()=>{ state.pidx = +psel.value; renderAll(); };

  const sc=document.getElementById('siteChips');
  sc.innerHTML = `<div class="chip ${state.site==='ALL'?'on':''}" data-site="ALL">全部站点</div>` +
    D.sites.map((s,i)=>`<div class="chip ${state.site===i?'on':''}" data-site="${i}">${esc(s.name)}</div>`).join('');
  sc.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
    const v=el.dataset.site; state.site = v==='ALL'? 'ALL' : +v; renderAll();
  });

  /* 巴西站淘汰筛选：只有切到巴西站时才显示淘汰/正常/全量三个按钮 */
  const eg = document.getElementById('elimGroup');
  const ec = document.getElementById('elimChips');
  const isBR = state.site!=='ALL' && D.sites[state.site] && D.sites[state.site].code==='Amazon.com.br.new';
  if(isBR && (DB.elimSkus||[]).length){
    eg.style.display = '';
    ec.innerHTML = `<div class="chip ${state.elim==='ALL'?'on':''}" data-elim="ALL">全量</div>
      <div class="chip ${state.elim==='ok'?'on':''}" data-elim="ok">正常</div>
      <div class="chip ${state.elim==='elim'?'on':''}" data-elim="elim">淘汰</div>`;
    ec.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
      state.elim = el.dataset.elim; renderAll();
    });
  } else {
    eg.style.display = 'none';
    if(state.elim!=='ALL') state.elim='ALL';
  }

  const bc=document.getElementById('bizChips');
  const bizKeys = D.dims['业务组'] ? Object.keys(D.dims['业务组']) : [];
  bc.innerHTML = `<div class="chip ${state.bizGroup==='ALL'?'on':''}" data-biz="ALL">全部业务组</div>` +
    bizKeys.map(k=>`<div class="chip ${state.bizGroup==k?'on':''}" data-biz="${esc(k)}">${esc(D.dims['业务组'][k])}</div>`).join('');
  bc.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
    const v=el.dataset.biz; state.bizGroup = v==='ALL'? 'ALL' : +v; renderAll();
  });

  const db=document.getElementById('drillBar');
  const keys=Object.keys(state.drill);
  if(!keys.length){
    db.innerHTML = `<span style="font-size:12px;color:#98a5bd">提示：点击任意板块的表格行，即可按该维度项下钻，下方所有板块会同步过滤</span>`;
  }else{
    db.innerHTML = keys.map(k=>`<span class="dchip">${DIM_LABEL[k]}：<b>${esc(prettyName(k, state.drill[k]))}</b><i data-clear="${k}" title="移除">✕</i></span>`).join('')
      + `<span class="reset" id="resetDrill">清除全部下钻</span>`;
    db.querySelectorAll('i[data-clear]').forEach(el=>el.onclick=()=>{ delete state.drill[el.dataset.clear]; renderAll(); });
    const r=document.getElementById('resetDrill'); if(r) r.onclick=()=>{ state.drill={}; renderAll(); };
  }
}

/* ---------- 01 站点整体 ---------- */
/* 每个板块底部右下角：只说明缺口颜色含义 */
const LEGEND_GAP = `<span style="margin-left:auto">缺口：<b style="color:#12855a">绿色＝实际少于预测（-）</b>　　<b style="color:#c94a4a">红色＝实际超出预测（+）</b></span>`;

function renderSite(){
  const cur = recsFor({});
  const tot = sumRecs(cur);
  const scopeTxt = `${periodLabel(state.pidx)}｜${state.site==='ALL'?'全部站点':D.sites[state.site].name}`;
  document.getElementById('siteTools').innerHTML = exportBtnHTML('_site') + colBtnHTML('_site');
  document.querySelector('#siteTools [data-colopen]').onclick=(ev)=>{ ev.stopPropagation(); openColPop(ev.currentTarget, '_site'); };
  document.querySelector('#siteTools [data-export]').onclick=(ev)=>{ ev.stopPropagation(); exportTableCSV('_site'); };
  document.getElementById('siteScope').textContent = scopeTxt;

  // 站点卡片：只在「全部站点」时展示。选中单个站点时它与上方 KPI 行内容重复，整块隐藏
  const cards=document.getElementById('siteCards');
  const subEl=document.getElementById('siteSubhead');

  document.querySelectorAll('#siteMatrix tbody tr').forEach(tr=>{

/* 表格里 5 个达成率列对应的趋势口径：柱1 = 分子、柱2 = 分母、折线 = 柱1 ÷ 柱2（必须自洽）。
   key 与 COL_DEF 的达成率列一一对应，「点某列的达成率 → 弹窗看该口径的趋势」就靠它。 */
const RATE_TREND = {
  mRate:    {label:'M版达成',           f:t=>MET.mRate(t),  a:t=>t.a,  b:t=>t.f4, aLabel:'订单销量',              bLabel:'销售预测（最新版）'},
  m1Rate:   {label:'M-1版达成',         f:t=>MET.m1Rate(t), a:t=>t.a,  b:t=>t.f3, aLabel:'订单销量',              bLabel:'销售预测（M-1）'},
  wRate:    {label:'加权达成',          f:t=>MET.wRate(t),  a:t=>t.a,  b:t=>t.f1, aLabel:'订单销量',              bLabel:'销售预测（加权）'},
  mOosRate: {label:'M版断货清洗达成率',  f:t=>MET.mOos(t),   a:t=>t.f5, b:t=>t.f4, aLabel:'断货清洗-预测（最新版）', bLabel:'销售预测（最新版）'},
  wOosRate: {label:'加权断货清洗达成率', f:t=>MET.wOos(t),  a:t=>t.f2, b:t=>t.f1, aLabel:'断货清洗-预测',          bLabel:'销售预测（加权）'},
  bandShare:  {label:'预测量占比',       f:t=>bandSelf(t),  a:t=>t.f1q, b:t=>t.f1, aLabel:'70%-130%预测量',        bLabel:'销售预测（加权）'},
  bandShare4: {label:'最新版预测量占比', f:t=>bandSelf4(t), a:t=>t.f4q, b:t=>t.f4, aLabel:'最新版70%-130%预测量',   bLabel:'销售预测（最新版）'},
};
/* 趋势窗口：截至所选周期的最近 TWIN 个周期（数据不足时取现有最早区间，保证至少 2 个点） */
function trendPeriods(){
  const n=D.periods.length;
  let end=Math.min(state.pidx, n-1), start=Math.max(0, end-(TWIN-1));
  if(end-start<1){ start=0; end=Math.min(n-1, Math.max(end,TWIN-1)); }
  const out=[]; for(let i=start;i<=end;i++) out.push(i);
  return out;
}

/* 组合图：柱1/柱2 + 折线（= 柱1÷柱2）。pred 决定取哪部分记录（站点 / 某个维度项），
   mfd 决定口径（不传则用站点面板当前选中的指标）。站点面板与「达成率弹窗」共用这一份绘图逻辑。 */
function trendSVG(pred, periods, W0, mfd){
  const W = Math.max(360, Math.round(W0||520));
  const H = W>760? 300 : 250;      // 面板变宽后适当加高，避免过于扁平
  const PL=48,PR=58,PT=22,PB=40;
  const pw=W-PL-PR, ph=H-PT-PB;
  const mf = mfd || TREND_METRICS[state.trendIdx] || TREND_METRICS.mRate;
  const data=periods.map(wi=>{
    const t=sumRecs(recsFor({pIdx:wi}).filter(pred));
    return {a:mf.a(t), b:mf.b(t), rate:mf.f(t)};
  });
  const maxV=Math.max(1, ...data.map(d=>Math.max(d.a,d.b)));
  const niceMax=Math.max(5000, Math.ceil(maxV/5000)*5000);
  const n=periods.length, step=pw/n;
  // 满宽面板（单站点）时柱体适当加粗，避免 3 组柱在宽画布里显得过空；半宽面板保持原样
  const wide = W>760;
  const bw=Math.max(13, Math.min(wide? 44 : 24, step*(wide? 0.22 : 0.19)));
  const gap=Math.max(4, bw*0.25), gw=bw*2+gap;
  const cy=v=>PT+ph-(v/niceMax)*ph;

  // 折线取值轴：按量级自适应（达成率类约 0~150%，区间占比类约 0~50% 等）
  const vals=data.map(d=>d.rate).filter(v=>v!=null && isFinite(v));
  const vmax=vals.length? Math.max(...vals) : 1;
  const cap=Math.max(0.05, vmax*1.12);
  const rStep=[0.5,0.25,0.2,0.1,0.05].find(s=>cap/s>=2) || 0.05;
  const axisMax=Math.ceil(cap/rStep)*rStep;
  const ry=r=>PT+ph-(Math.min(r==null?0:r, axisMax)/axisMax)*ph;

  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  // 左轴：件数网格
  for(let i=0;i<=4;i++){
    const v=niceMax*i/4, y=cy(v);
    s+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${(PL+pw).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${i===0?'#d8e0ee':'#eef2f9'}" stroke-width="1"/>`;
    s+=`<text class="axis-lbl" x="${PL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${fmtK(v)}</text>`;
  }
  // 右轴：比率网格
  const ticks=Math.round(axisMax/rStep);
  for(let i=0;i<=ticks;i++){
    const r=i*rStep, y=ry(r);
    s+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${(PL+pw).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#f2e7cf" stroke-width="1" stroke-dasharray="3 4"/>`;
    s+=`<text class="axis-lbl" x="${PL+pw+8}" y="${(y+3.5).toFixed(1)}" text-anchor="start" fill="#c99b2e">${(r*100).toFixed(0)}%</text>`;
  }
  // 先定位折线数值标签（点正上方居中；相邻高度接近时上移错位），柱值标签据此避让
  const pts=data.map((d,i)=>({x:PL+step*i+step/2, y:ry(d.rate), r:d.rate, ly:null}));
  let prevLy=null;
  pts.forEach(p=>{
    if(p.r==null || !isFinite(p.r)) return;
    let ly=p.y-8;
    if(prevLy!=null && Math.abs(ly-prevLy)<12) ly=prevLy-13;
    ly=Math.max(PT-6, ly);
    p.ly=ly; prevLy=ly;
  });

  // 柱：所选指标的分子 / 分母
  data.forEach((d,i)=>{
    const cx=PL+step*i+step/2;
    const x1=cx-gw/2, x2=x1+bw+gap;
    const y1=cy(d.a), y2=cy(d.b);
    s+=`<rect x="${x1.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${(PT+ph-y1).toFixed(1)}" rx="3" fill="#2f5bd7"><title>${D.periods[periods[i]].label} ${mf.aLabel} ${fmtN(d.a,1)} 件</title></rect>`;
    s+=`<rect x="${x2.toFixed(1)}" y="${y2.toFixed(1)}" width="${bw.toFixed(1)}" height="${(PT+ph-y2).toFixed(1)}" rx="3" fill="#c6d2e8"><title>${D.periods[periods[i]].label} ${mf.bLabel} ${fmtN(d.b,1)} 件</title></rect>`;
    // 柱值标签：柱1、柱2 都标。默认各自柱顶上方居中；
    // 窄面板里两柱挨太近（中心距不足以并排写字）时，强制上下错开至少一个行高（14px），否则两个数字会视觉相撞。
    // 与折线标签纵向撞位时让开：柱够高就移入柱内（白字），否则挪到折线标签上方。
    const rl = pts[i].ly;
    const slot = bw + gap;
    const tight = slot < 42;
    const bars = [[x1+bw/2, y1, d.a, '#2f5bd7'], [x2+bw/2, y2, d.b, '#8593aa']];
    const ys = bars.map((b,k)=>{
      let ly = b[1] - 5;
      if(tight && k===1) ly = b[1] - 22;
      return Math.max(PT - 6, ly);
    });
    if(tight && Math.abs(ys[0] - ys[1]) < 14){
      ys[1] = Math.max(PT - 6, ys[0] - 14);          // 柱2 让到柱1 上方一行
      if(ys[0] - ys[1] < 14) ys[0] = ys[1] + 14;     // 顶部空间不够时反向把柱1 压到下面一行
    }
    bars.forEach((b,k)=>{
      const bx=b[0], top=b[1], v=b[2], col=b[3];
      const hgt = PT + ph - top;
      if(rl != null && Math.abs(ys[k] - rl) < 12){
        if(hgt >= 28 && bw >= 34){
          s+=`<text class="bar-lbl" x="${bx.toFixed(1)}" y="${(top+14).toFixed(1)}" text-anchor="middle" fill="#ffffff" font-weight="700">${fmtK(v)}</text>`;
        }else{

    });
    s+=`<text class="axis-lbl" x="${cx.toFixed(1)}" y="${(PT+ph+16).toFixed(1)}" text-anchor="middle" fill="#5b6b8a">${D.periods[periods[i]].short}</text>`;
  });

  // 折线
  const real=pts.filter(p=>p.ly!=null);
  if(real.length>1){
    s+=`<polyline fill="none" stroke="#e0a52c" stroke-width="2" stroke-dasharray="5 4" points="${real.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}"/>`;
  }
  real.forEach(p=>{
    s+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.6" fill="#fff" stroke="#e0a52c" stroke-width="2"><title>${mf.label} ${(p.r*100).toFixed(1)}%</title></circle>`;
    s+=`<text class="bar-lbl" x="${p.x.toFixed(1)}" y="${p.ly.toFixed(1)}" text-anchor="middle" fill="#b3801a" font-weight="700" stroke="#ffffff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${(p.r*100).toFixed(1)}%</text>`;
  });
  s+='</svg>';
  return s;
}

/* ---------- 02~06 维度板块 ---------- */
/* 排序状态：state.sort[表key] = {k:'列键', dir: -1 从高到低 | 1 从低到高}，默认订单销量从高到低。
   列键取 COL_DEF 的 k；排序取值走 COL_DEF 的 v(o)。 */
const DEF_SORT = {k:'a', dir:-1};
/* 注意：COL_DEF 在本节之后才定义，所以取值函数必须延迟到排序时再查，不能在这里预先建表（会踩 TDZ） */
function sortGet(k){
  const c = COL_DEF.find(x=>x.k===k);
  return c ? c.v : (o=>o.a);
}
/* 空值（分母为 0 导致的 rate=null 等）无论升降序都排最后；并列时按订单销量降序，保证顺序稳定 */
function sortRows(rows, st){
  const s = (st && st.k) ? st : DEF_SORT;
  const dir = (s.dir===1) ? 1 : -1;
  const get = sortGet(s.k);
  return [...rows].sort((x,y)=>{
    const a=get(x), b=get(y);
    const an=(a==null||!isFinite(a)), bn=(b==null||!isFinite(b));
    if(an && bn) return y.a-x.a;
    if(an) return 1;
    if(bn) return -1;
    if(a!==b) return dir*(a-b);
    return y.a-x.a;
  });
}
function sortArrow(st, k){
  if(!st || st.k!==k) return '⇅';
  return st.dir===1 ? '▲' : '▼';
}
/* 表头点击排序：列宽拖拽手柄（.rz）与筛选按钮（.fbtn）上的点击不触发 */
function bindSorts(scope){
  if(!scope) return;
  scope.querySelectorAll('table.wide[data-tkey]').forEach(tb=>{
    const key=tb.dataset.tkey;
    tb.querySelectorAll('thead th[data-sort]').forEach(th=>{
      th.onclick=(ev)=>{
        if(ev.target.closest && (ev.target.closest('.rz') || ev.target.closest('.fbtn'))) return;
        const k=th.dataset.sort, cur=state.sort[key]||DEF_SORT;
        state.sort[key] = (cur.k===k) ? {k:k, dir:(cur.dir===1? -1 : 1)} : {k:k, dir:-1};
        const sec=tb.closest('section[data-dim]');
        const sy = window.scrollY || window.pageYOffset || 0;
        if(sec) renderDim(sec); else renderSite();
        requestAnimationFrame(()=>window.scrollTo(0, sy));
      };
    });
  });
}

function parseFKey(key){ const i=key.indexOf('@'); return i<0? {main:key, aux:null} : {main:key.slice(0,i), aux:key.slice(i+1)}; }

/* 弹出层定位：absolute + 文档坐标，所以跟随页面滚动；超出视口下方则翻到上方 */
function placePop(el, anchor, alignRight){
  const sx=window.scrollX||window.pageXOffset||0, sy=window.scrollY||window.pageYOffset||0;
  const r=anchor.getBoundingClientRect(), w=el.offsetWidth, h=el.offsetHeight;
  const left=Math.max(12, Math.min(alignRight? r.right-w : r.left, window.innerWidth-w-12));
  let top=r.bottom+6;
  if(r.bottom+h>window.innerHeight-10 && r.top-h-6>8) top=r.top-h-6;
  el.style.left=(left+sx)+'px'; el.style.top=(top+sy)+'px';
}

function openFilter(key, anchor, rows){

function applyFilterLive(keepOpen){
  const main=fpop.main, isAux=!!fpop.aux;
  const hide=new Set(fpop.all.filter(n=>!fpop.sel.has(n)));

  renderFPop();

};

function exportTableCSV(tblKey){
  const table = document.querySelector(`table[data-tkey="${esc(tblKey)}"]`);
  if(!table) return;
  /* 实际隐藏的列 = 自定义列 + 该表默认排除列（SKU 表默认藏 4 列）。
     直接用表格自身的 data-hide 属性判定，与画面上看到的完全一致。 */
  const hidden = new Set((table.getAttribute('data-hide')||'').split(/\s+/).filter(Boolean));
  const keep = el => { const c = el.getAttribute('data-c'); return !c || !hidden.has(c); };
  const rows = [];
  // 收集表头（跳过带 colspan 的分组标题行，仅取实际列头；隐藏列不导出）
  const headers = [];
  table.querySelectorAll('thead th').forEach(th=>{
    if(th.hasAttribute('colspan')) return;   // 跳过 "订单达成率" 等分组标题
    if(!keep(th)) return;                    // 自定义列里被取消勾选的列不导出
    const t = th.textContent.replace(/[⇅▼▲]+/,'').trim();
    if(t) headers.push(t);
  });
  rows.push(headers.map(h=>`"${h}"`).join(','));

  // 收集数据行（同样跳过隐藏列，保证列数与表头一一对应）
  table.querySelectorAll('tbody tr').forEach(tr=>{
    const cells = [];
    tr.querySelectorAll('td').forEach(td=>{
      if(!keep(td)) return;
      let v = td.textContent.trim();
      // 名称列里的 "已下钻" 标记去掉
      v = v.replace(/已下钻/g,'').trim();
      cells.push(`"${v.replace(/"/g,'""')}"`);
    });
    if(cells.length) rows.push(cells.join(','));
  });

  const csv = '\uFEFF' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const scope = `${state.mode}_${D.periods[state.pidx]?.iso||''}`;
  const label = (tblKey==='_site'?'站点明细':DIM_LABEL[tblKey]||tblKey);
  a.download = `${scope}_${label}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function wideTable(shown, colLabel, curTot, onName, filterKey, fstat, colw, twoCol, auxCols, tblKey, excludeCols){
  const baseW = colw || COLW;
  const W = (state.colW[tblKey] && state.colW[tblKey].length===baseW.length) ? state.colW[tblKey].slice() : baseW.slice();
  const nameN = twoCol ? 2 : 1;
  const auxN = auxCols ? auxCols.length : 0;
  const headN = 1 + auxN + nameN;
  const hide = hideColsSet(tblKey);
  const hideAll = excludeCols && excludeCols.size ? new Set([...hide, ...excludeCols]) : hide;
  const visCols = COL_DEF.filter(c=>!hideAll.has(c.k));
  const colOf = i => (i>=headN) ? COL_DEF[i-headN] : null;
  let totalW=0; W.forEach((w,i)=>{ const d=colOf(i); if(!d || !hideAll.has(d.k)) totalW+=w; });
  const cols = W.map((w,i)=>{ const d=colOf(i); return `<col style="width:${w}px"${d?` data-c="${d.k}"`:''}>`; }).join('');
  // 固定列（#/附属列/名称列）的 left 偏移，由前面各列宽度累加得到
  let acc=0; const L=[];
  for(let i=0;i<headN;i++){ L.push(acc); acc+=W[i]; }
  const stkVar = `--lka:${L[1]||0}px;--lka2:${L[2]||0}px;--lk1:${L[1+auxN]||0}px;--lk2:${L[1+auxN+1]||0}px;`;
  const rz = i => `<span class="rz" data-rz="${i}" title="拖动调整列宽（双击恢复默认）"></span>`;
  const grpRow = COL_GROUPS.map((g,gi)=>{
    const n = visCols.filter(c=>c.g===gi).length;
    return n? `<th class="grp ${g.cls}" colspan="${n}">${g.name}</th>` : '';
  }).join('');
  const st = state.sort[tblKey] || DEF_SORT;
  const idxRow = visCols.map(c=>{
    const on = st.k===c.k;
    return `<th class="${c.th} sortable${on?' sorted':''}" data-c="${c.k}" data-sort="${c.k}"`
      + ` title="${esc(c.t)}&#10;点击排序：从高到低 → 再点从低到高${on?(st.dir===1?'（当前：从低到高）':'（当前：从高到低）'):''}">`
      + `${c.t}<i class="sk">${sortArrow(st, c.k)}</i>${rz(headN+COL_DEF.indexOf(c))}</th>`;
  }).join('');
  const fbtn = filterKey
    ? `<button class="fbtn${fstat&&fstat.active?' on':''}" data-fopen="${esc(filterKey)}" title="筛选：勾选要显示的项目">${FUNNEL}${fstat&&fstat.active?`<b>${fstat.shown}/${fstat.all}</b>`:''}</button>`
    : '';
  const abtn = c => `<button class="fbtn${c.fstat&&c.fstat.active?' on':''}" data-fopen="${esc(c.fkey)}" title="筛选：勾选要显示的${esc(c.label)}">${FUNNEL}${c.fstat&&c.fstat.active?`<b>${c.fstat.shown}/${c.fstat.all}</b>`:''}</button>`;
  const head = `<colgroup>${cols}</colgroup><thead>
      <tr>
        <th class="stk c-rank" rowspan="2">#${rz(0)}</th>
        ${auxN? auxCols.map((c,i)=>`<th class="stk ${i===0?'c-name3':'c-name4'}" rowspan="2">${esc(c.label)}${abtn(c)}${rz(1+i)}</th>`).join('') : ''}
        ${twoCol
          ? `<th class="stk c-name" rowspan="2"><span class="cnm">最早SKU</span>${fbtn}${rz(1+auxN)}</th><th class="stk c-name2" rowspan="2">预测SKU${rz(2+auxN)}</th>`
          : `<th class="stk c-name" rowspan="2"><span class="cnm">${colLabel}</span>${fbtn}${rz(1+auxN)}</th>`}
        ${grpRow}
      </tr>
      <tr>${idxRow}</tr>
    </thead>`;
  const spanN = visCols.length;
  const auxOf = r => auxCols ? auxCols.map(c=>c.map.get(r.id)) : null;
  const auxEmpty = auxN? auxCols.map((c,i)=>`<td class="stk ${i===0?'c-name3':'c-name4'}"></td>`).join('') : '';
  // 站点明细表不参与「点达成率弹趋势」（站点本身已有并排趋势图），其余维度板块都参与
  const clkRate = !!tblKey && tblKey!=='_site';
  const body = shown.length
    ? shown.map((r,i)=>rowHTML(r,i,colLabel,curTot, onName!=null && r.name===onName, twoCol, auxOf(r), clkRate)).join('')
    : `<tr><td class="stk c-rank"></td>${auxEmpty}<td class="stk c-name" style="font-weight:400;color:var(--muted)">已全部筛除</td>${twoCol?'<td class="stk c-name2"></td>':''}<td colspan="${spanN}" style="text-align:center;color:var(--muted)">点击表头筛选按钮重新勾选要显示的项目</td></tr>`;
  const hideAttr = [...hideAll].join(' ');
  return `<div class="tscroll"><table class="wide${auxN?' lst':''}" style="min-width:${totalW}px;${stkVar}"`
    + ` data-tkey="${esc(tblKey||'')}" data-headn="${headN}" data-auxn="${auxN}" data-twocol="${twoCol?'1':'0'}"`
    + `${hideAttr?` data-hide="${hideAttr}"`:''}>${head}<tbody>${body}</tbody></table></div>`;

/* ---------- 列宽拖拽调整 ---------- */
function applyColW(table, arr){
  const cols=[...table.querySelectorAll('col')];
  cols.forEach((c,i)=>{ if(arr[i]) c.style.width=arr[i]+'px'; });
  const hide = hideColsSet(table.dataset.tkey);
  let totalW=0;
  cols.forEach((c,i)=>{ const k=c.dataset.c; if(!k || !hide.has(k)) totalW += (arr[i]||parseFloat(c.style.width)||0); });
  table.style.minWidth=totalW+'px';
  const headN=+table.dataset.headn||1, auxN=+table.dataset.auxn||0, two=+table.dataset.twocol||0;
  let acc=0; const L=[];
  for(let i=0;i<headN;i++){ L.push(acc); acc+=arr[i]||0; }
  table.style.setProperty('--lka',(L[1]||0)+'px');
  table.style.setProperty('--lka2',(L[2]||0)+'px');
  table.style.setProperty('--lk1',(L[1+auxN]||0)+'px');
  if(two) table.style.setProperty('--lk2',(L[2+auxN]||0)+'px');
}

function onColUp(){

    const hide = state.hideAux[dimKey+'@'+k] || null;
    const rows = (()=>{ const m=new Map();
      for(const o of map.values()){ const c=m.get(o.name)||{name:o.name,a:0}; c.a+=o.a; m.set(o.name,c); }
      return [...m.values()].sort((x,y)=>y.a-x.a); })();
    const fstat2 = {active: !!(hide&&hide.size), shown: rows.filter(o=>!(hide&&hide.has(o.name))).length, all: rows.length};
    return {label:k, fkey:dimKey+'@'+k, fstat:fstat2, map:map, hide:hide, rows:rows};
  });
  const scoped = Object.keys(state.drill).filter(k=>k!==dimKey).length>0;

  const mode=state.sort[dimKey]||DEF_SORT;
  const rowsAll=sortRows(curRows, mode);
  const hide=state.hide[dimKey];
  const rows = auxCols.some(c=>c.hide&&c.hide.size)
    ? rowsAll.filter(r=>auxCols.every(c=>{           // 多个附属列同时生效
        if(!c.hide || !c.hide.size) return true;
        const o=c.map.get(r.id); return o && !c.hide.has(o.name);
      }))
    : rowsAll;
  const base = (hide&&hide.size)? rows.filter(r=>!hide.has(r.name)) : rows;
  const topN = state.top[dimKey]||DEF_TOP[dimKey]||12;
  const shown = base.slice(0, topN);
  const fstat = {active: !!(hide&&hide.size), shown: base.length, all: rows.length};

  section.innerHTML = `
    <div class="block-head">
      <div class="btitle"><span class="bnum">${blockNo}</span><h2>${DIM_LABEL[dimKey]}</h2>
        <span class="cnt">${base.length!==rowsAll.length? `${base.length} / ${rowsAll.length} 项` : `${rowsAll.length} 项`}</span>
        ${scoped?`<span class="scoped">已受上级下钻过滤</span>`:''}</div>
      <div class="block-tools">${exportBtnHTML(dimKey)}${colBtnHTML(dimKey)}</div>
    </div>
    <div class="block-body">
      ${rowsAll.length? compBar(shown, base, DIM_LABEL[dimKey]) : ''}
      ${rowsAll.length? wideTable(shown, DIM_LABEL[dimKey], curTot, state.drill[dimKey], dimKey, fstat, dimKey==='国家Listing'?COLW_LST:(dimKey==='SKU'?COLW_SKU:(dimKey==='产品组'?COLW_PG:null)), dimKey==='SKU', auxCols.length? auxCols : null, dimKey, dimKey==='SKU'?new Set(['f1q','bandShare','f4q','bandShare4']):null) : '<div class="empty">当前筛选条件下暂无数据</div>'}
      ${base.length>shown.length?`<div class="more"><button data-more="${dimKey}">展开剩余 ${base.length-shown.length} 项 ▾</button></div>`:''}
      ${(topN>1e5&&base.length>(DEF_TOP[dimKey]||12))?`<div class="more"><button data-collapse="${dimKey}">收起（只看前 ${DEF_TOP[dimKey]||12} 项）▴</button></div>`:''}
    </div>
    <div class="legend">${TIER_LEGEND}${LEGEND_GAP}</div>`;

  // 点某行的达成率数字 → 弹窗看该维度项自己的近 N 期趋势（不要触发整行下钻）
  section.querySelectorAll('td.rt').forEach(td=>{
    td.onclick = ev=>{
      if(textSelecting()) return;          // 拖选/全选复制时不弹趋势窗
      ev.stopPropagation();
      const tr = td.closest('tr');
      if(tr && tr.dataset.name) openTrendPop(dimKey, tr.dataset.name, td.dataset.rt);
    };
  });

  section.querySelectorAll('tbody tr').forEach(tr=>{
    tr.onclick=()=>{
      if(textSelecting()) return;          // 拖选/全选复制时不下钻
      const nm=tr.dataset.name;
      if(state.drill[dimKey]===nm) delete state.drill[dimKey]; else state.drill[dimKey]=nm;
      renderAll();
    };
  });
  const ebtn=section.querySelector('[data-export]');
  if(ebtn) ebtn.onclick=(ev)=>{ ev.stopPropagation(); exportTableCSV(dimKey); };
  const cbtn=section.querySelector('[data-colopen]');
  if(cbtn) cbtn.onclick=(ev)=>{ ev.stopPropagation(); openColPop(cbtn, dimKey); };
  section.querySelectorAll('button[data-fopen]').forEach(b=>{
    const key=b.dataset.fopen, c=auxCols.find(x=>x.fkey===key);
    b.onclick=(ev)=>{ ev.stopPropagation(); openFilter(key, b, c? c.rows : rows); };
  });
  bindSorts(section);
  const mb=section.querySelector('button[data-more]');
  if(mb) mb.onclick=()=>{ state.top[dimKey]=1e6; renderDim(blockOf(dimKey)); };
  const cb=section.querySelector('button[data-collapse]');
  if(cb) cb.onclick=()=>{ state.top[dimKey]=DEF_TOP[dimKey]||12; renderDim(blockOf(dimKey)); };
}

/* 构成条最多适用于多少项：超过该数量时条上几乎全是「其他」，失去阅读价值，直接不渲染 */
const COMP_MAX = 20;

function compBar(shown, all, label){
  const total=all.reduce((s,r)=>s+r.a,0);
  if(!(total>0)) return '';
  if(all.length > COMP_MAX) return '';   // 高基数维度（三级分类 / 国家Listing / SKU）不展示订单销量占比
  let items=all.slice().sort((x,y)=>y.a-x.a);
  let tail=null;
  if(items.length>14){ tail=items.slice(14).reduce((s,r)=>s+r.a,0); items=items.slice(0,14); }
  const segs=items.map((r,i)=>{
    const sh=r.a/total;
    const c=PALETTE[i%PALETTE.length];
    const lbl = sh>=0.095? `${r.name} ${(sh*100).toFixed(1)}%` : '';
    return `<div class="seg" style="flex:${Math.max(r.a,0.0001).toFixed(4)};background:${c}" title="${esc(r.name)}：${fmtN(r.a)} 件（${fmtPct(sh)}）"><span>${esc(lbl)}</span></div>`;
  });
  if(tail!=null && tail>0){
    const restN = all.length-14;
    segs.push(`<div class="seg" style="flex:${tail.toFixed(4)};background:${OTHER}" title="其他 ${restN} 项合计：${fmtN(tail)} 件（${fmtPct(tail/total)}）"><span>其他 ${(tail/total*100).toFixed(1)}%</span></div>`);
  }
  return `<div class="compline">
    <span class="comp-lbl">订单销量占比</span>
    <div class="comp" title="按订单销量计算各${label}的占比，合计 100%">${segs.join('')}</div>
  </div>`;
}

/* ================= Q4 冲销异常 =================
   两块异常清单（加权版70%-130%占比异常 / 加权达成异常）× 两个维度（三级分类 / 国家Listing）。
   跟随「粒度 + 周期 + 站点 + 业务组」变化；窗口固定为最近 4 个周期（周报 4 周 / 月报 4 月）。
   判定分级（同一项命中多档时取最靠前的一档）：
     ① 连续4期不达且无改善：窗口内每期都低于阈值，且逐期持续下降（每期都不高于上一期，中途无回暖）
     ② 连续4期不达：窗口内每期都低于阈值，但中途出现回升
     ③ 一半及以上不达：窗口内 ≥ 半数周期低于阈值（占比用更严的阈值）                */
const Q4_WIN = 4;      // 近 4 周 / 近 4 月
const Q4_TOP = 10;     // 三级分类清单默认展示前 10 项
/* 国家Listing 基数大（几百条），TOP10 只占两成不到，默认展示与「集中度」都算到 TOP15 */
const Q4_TOP_DIM = {'国家Listing':15};
function q4TopN(dimKey){ return Q4_TOP_DIM[dimKey] || Q4_TOP; }
const Q4_CFG = {
  share: { label:'加权版70%-130%占比异常', thrAll:0.35, thrHalf:0.30,
           val:b=> b.f1>0 ? b.f1q/b.f1 : null, sub:'占比', ruleA:'< 35%', ruleB:'< 30%' },
  rate:  { label:'加权达成异常',           thrAll:0.90, thrHalf:0.90,
           val:b=> b.f1>0 ? b.a/b.f1 : null,   sub:'达成', ruleA:'< 90%', ruleB:'< 90%' }
};
function q4Window(){
  const n=D.periods.length, end=Math.min(state.pidx, n-1), start=Math.max(0, end-(Q4_WIN-1));
  const out=[]; for(let i=start;i<=end;i++) out.push(i); return out;
}
/* 按维度项汇总窗口内每期的 (加权预测, 70%-130%预测量, 订单销量)，再按上面三档规则筛出异常项 */
/* ---------- Q4 库存三列（FBA总可销售展示库存 / 7DMS / 可售天数） ----------
   数据来自「MX&BR冲坑周跟进」表，只有墨西哥站（MX）口径：
   全部站点 / 墨西哥站显示数值，选巴西站时三列统一显示「—」。
   三级分类取「5.三级分类」的 E 列（国家=MX），国家Listing 取「6.Listing」的 G 列（国家=MX）。 */
const INV = (DB && DB.inv) || {cat:{}, listing:{}};
function invScopeMx(){
  if(state.site==='ALL') return true;
  const s = D.sites[state.site];
  if(!s) return false;
  return /MX/i.test(String(s.name||'') + ' ' + String(s.code||''));
}
function invOf(dimKey, name){
  if(!invScopeMx()) return null;
  const map = dimKey==='国家Listing' ? INV.listing : (dimKey==='三级分类' ? INV.cat : null);
  if(!map) return null;
  return map[name] || null;
}
/* 可售天数源表里会直接给「∞」（7DMS=0 但仍有库存），原样显示 */
function invNum(v, d){
  if(v==null || v==='') return '—';
  if(typeof v==='string') return v;
  return String(+(+v).toFixed(d));
}
function q4Rows(kind, dimKey){
  const cfg=Q4_CFG[kind], field=DIDX[dimKey], per=q4Window(), ps=new Set(per);
  /* 上级维度：三级分类看它的 BU，国家Listing 看它所属的三级分类（按加权预测取最大者，多个标 +N） */
  const AUX = ({'三级分类':'BU','国家Listing':'三级分类'})[dimKey];
  /* DIDX 的值是字段名字符串（如 'b'），不是数字下标 */
  const auxField = AUX!=null && DIDX[AUX]!=null ? DIDX[AUX] : null;
  const agg=new Map();
  for(let i=0;i<NREC;i++){
    const r=REC[i];
    if(state.site!=='ALL' && r.s!==state.site) continue;
    if(state.bizGroup!=='ALL' && r.g!==state.bizGroup) continue;
    if(!ps.has(r.w)) continue;
    let m=agg.get(r[field]);
    if(!m){ m={f1:0, byP:new Map(), aux:null}; agg.set(r[field], m); }
    m.f1+=r.f1;
    let b=m.byP.get(r.w); if(!b){ b={f1:0,f1q:0,a:0}; m.byP.set(r.w,b); }
    b.f1+=r.f1; b.f1q+=r.f1q; b.a+=r.a;
    if(auxField!=null){
      if(!m.aux) m.aux=new Map();
      m.aux.set(r[auxField], (m.aux.get(r[auxField])||0) + r.f1);
    }
    /* 业务负责人：同一个三级分类 / Listing 可能跨多个负责人，按加权预测取最大者，其余标 +N */
    if(!m.own) m.own=new Map();
    m.own.set(r.o, (m.own.get(r.o)||0) + r.f1);
  }
  const out=[];
  agg.forEach((m, idx)=>{
    const series=per.map(p=>{ const b=m.byP.get(p); return b? cfg.val(b) : null; });
    const got=series.filter(v=>v!=null);
    if(got.length<2) return;                                  // 有效点太少，不参与判定
    const allLow = got.length===series.length && got.every(v=>v<cfg.thrAll);
    const halfLow = got.filter(v=>v<cfg.thrHalf).length*2 >= per.length;
    /* 「持续下降」= 逐期比较，每期都不高于上一期（中途任何一次回升就不算） */
    const falling = got.every((v,i)=> i===0 || v <= got[i-1]);
    const tier = allLow ? (falling?1:2) : (halfLow?3:0);
    if(!tier) return;
    const cur = m.byP.get(state.pidx) || {f1:0, a:0};
    const curF1 = cur.f1||0, curA = cur.a||0;
    let auxName='', auxMore=0;
    if(m.aux && m.aux.size){
      const arr=[...m.aux.entries()].sort((x,y)=> y[1]-x[1]);
      auxName = D.dims[AUX][arr[0][0]];
      auxMore = m.aux.size - 1;
    }
    let ownName='', ownMore=0;
    if(m.own && m.own.size){
      const oarr=[...m.own.entries()].sort((x,y)=> y[1]-x[1]);
      ownName = D.dims['业务负责人'][oarr[0][0]];
      ownMore = m.own.size - 1;
    }
    out.push({idx, name:D.dims[dimKey][idx], series, tier, curF1, curA,
              curGap: curF1 - curA,          // 加权预测缺口 = 销售预测(加权) − 订单销量（本期）
              auxName, auxMore, ownName, ownMore, winF1:m.f1,
              inv: invOf(dimKey, D.dims[dimKey][idx])});   // [库存, 7DMS, 可售天数] 或 null
  });
  /* 异常里优先展示缺口大的：本期加权预测缺口 desc → 本期加权预测 desc → 名称 */
  out.sort((a,b)=> b.curGap-a.curGap || b.curF1-a.curF1 || String(a.name).localeCompare(String(b.name),'zh'));
  return out;
}
/* 三档判定文案：① 连续不达且无改善 ② 连续不达 ③ 一半及以上不达（周期单位随粒度走） */
function tierTxt(tier, per){
  const n = per.length;
  if(tier===1) return `连续${n}${U}不达且无改善`;
  if(tier===2) return `连续${n}${U}不达`;
  return '一半及以上不达';
}
function tierTip(tier, per){
  const n = per.length;
  if(tier===1) return `近 ${n} ${U}每期都低于阈值，且逐期持续下降（每期都不高于上一期，中途无回暖）`;
  if(tier===2) return `近 ${n} ${U}每期都低于阈值，但中途出现回升，故排在第二档`;
  return `近 ${n} ${U}中有一半及以上的${U}低于阈值`;
}
/* 当前筛选（粒度/时间/站点/业务组）下「本期」的整体加权缺口 = Σ(销售预测(加权) − 订单销量)。
   这是全口径总和，与按哪个维度拆无关 —— 四张清单共用同一个数，才对得上主看板的加权订单预测缺口。 */
function q4ScopeGap(){
  let g=0;
  for(let i=0;i<NREC;i++){
    const r=REC[i];
    if(state.site!=='ALL' && r.s!==state.site) continue;
    if(state.bizGroup!=='ALL' && r.g!==state.bizGroup) continue;
    if(r.w!==state.pidx) continue;
    g += r.f1 - r.a;
  }
  return g;
}
/* 缺口集中度：分母统一用「当前筛选整体加权缺口」，算 TOP10 占比 + 累计到多少项达到 40% */
function q4Pareto(rows, total, n){
  const t = (total==null) ? rows.reduce((s,r)=> s + (r.curGap||0), 0) : total;
  if(!(t>0)) return null;
  const topN = rows.slice(0, n||Q4_TOP).reduce((s,r)=> s + (r.curGap||0), 0);
  let cum=0, k=0;
  for(let i=0;i<rows.length;i++){
    cum += (rows[i].curGap||0);
    if(cum >= t*0.4){ k=i+1; break; }
  }
  return { total: t, top10: topN, topN: n||Q4_TOP, p10: topN/t, k40: k };
}
function q4CardHTML(kind, dimKey, rows, per, idx, scopeGap){

      + (pr.k40
          ? `按缺口从大到小累计，到 <b>TOP ${pr.k40}</b> 项即占 <i>40%</i>。`

/* 导出：每张清单单独导出 CSV（导出当前筛选下的完整清单，不受「展开/收起」影响）。
   文本生成抽成纯函数 q4CSV()，便于回归测试直接断言内容。 */
let q4Last = {};
function q4CSV(key){
  const rows = q4Last[key] || [];
  const parts = String(key).split(':');
  const cfg = Q4_CFG[parts[0]] || {}, dimKey = parts[1];
  const per = q4Window();
  const auxLabel = dimKey==='国家Listing' ? '三级分类' : 'BU';
  const head = [auxLabel, DIM_LABEL[dimKey]||dimKey, '负责人', '加权预测','订单销量','加权缺口',
                'FBA总可销售展示库存','7DMS','可售天数']
    .concat(per.map(p=> D.periods[p].label)).concat(['判定']);
  const q = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const lines = [head.map(q).join(',')];
  rows.forEach(r=>{
    const aux = r.auxName ? (r.auxName + (r.auxMore? ' +'+r.auxMore : '')) : '';
    /* 数值一律用屏幕上看到的那套格式（千分位 + 缺口的正负号），保证导出与画面逐格对得上 */
    const own = r.ownName ? (r.ownName + (r.ownMore? ' +'+r.ownMore : '')) : '';
    const iv = r.inv;   // 库存三列：与画面同格式（库存整数、7DMS 两位、天数一位/∞）
    const cells = [aux, r.name, own, fmtN(r.curF1,1), fmtN(r.curA,1), fmtGap(r.curGap),
                   iv? fmtN(iv[0],0) : '', iv? invNum(iv[1],2) : '', iv? invNum(iv[2],1) : '']
      .concat(r.series.map(v=> v==null ? '' : (v*100).toFixed(1)+'%'))
      .concat([tierTxt(r.tier, per)]);
    lines.push(cells.map(q).join(','));
  });
  return '\uFEFF' + lines.join('\n');
}
function exportQ4CSV(key){
  const rows = q4Last[key] || [];
  if(!rows.length) return;
  const parts = String(key).split(':');
  const cfg = Q4_CFG[parts[0]] || {}, dimKey = parts[1];
  const blob = new Blob([q4CSV(key)], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${state.mode}_${(D.periods[state.pidx]||{}).iso||''}_Q4_${cfg.label||''}_${DIM_LABEL[dimKey]||dimKey}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

      <b>无改善</b>= 逐期持续下降（每期都不高于上一期，中途无回暖；持平算未改善，回升才算打破趋势）；占比序列为「加权版70%-130%预测量 ÷ 该项销售预测(加权)」。

  }
  const blocks=[['share','三级分类'],['share','国家Listing'],['rate','三级分类'],['rate','国家Listing']];
  /* 同一个维度项在「占比异常」和「达成异常」两张清单里可能都命中，入口数字按维度项去重 */
  const hit={'三级分类':new Set(), '国家Listing':new Set()};

/* 导航吸附在顶部粘性筛选栏之下，避免被遮挡 */
function syncNavTop(){
  const el=document.getElementById('sidenav');
  const f=document.querySelector('.filters');
  if(!el||!f) return;
  const h=Math.round(f.getBoundingClientRect().height);
  el.style.top=(h+8)+'px';
  el.style.maxHeight='calc(100vh - '+(h+16)+'px)';
  const root=document.documentElement;
  if(root && root.style) root.style.setProperty('--nav-gap', (h+10)+'px');
}

function renderNav(){
  const el=document.getElementById('sidenav');
  if(!el) return;
  const rows=navRows();
  // 给每个目标板块一个锚点 id（已有 id 的沿用），作为 href 兜底
  rows.forEach((r,i)=>{ const tg=document.querySelector(r.sel); if(tg && !tg.id) tg.id='nav-sec-'+i; });
  el.innerHTML = `<div class="navh">目录</div>`
    + rows.map((r,i)=>{
        const tg=document.querySelector(r.sel);
        const aid=(tg && tg.id) ? tg.id : '';
        return `<a class="navi" data-i="${i}"${aid?` href="#${aid}"`:''}><span class="nn">${r.no}</span><span class="nt">${esc(r.label)}</span></a>`;
      }).join('')
    + `<a class="navi up" data-top="1"><span class="nt">↑ 回到顶部</span></a>`;
  el.querySelectorAll('.navi').forEach(a=>{
    a.onclick=(ev)=>{
      ev.preventDefault();
      if(a.dataset.top){ window.scrollTo({top:0, behavior:'smooth'}); return; }
      const r=rows[+a.dataset.i];
      const target=r && document.querySelector(r.sel);
      if(!target) return;
      // 目标点要避开粘性筛选栏：与 section.block 的 scroll-margin-top 用同一个 --nav-gap
      const gap=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nav-gap')) || 96;
      const top=Math.max(0, Math.round(target.getBoundingClientRect().top + window.scrollY - gap));
      const startY=window.scrollY;
      window.scrollTo({top:top, behavior:'smooth'});
      // 兜底：平滑滚动完全没动（个别环境）就直接瞬时跳过去。
      // ⚠️ 不能用 location.hash —— hash 变成页内锚点后，Q4 页会误判成「离开 Q4」而被踢回主看板。
      setTimeout(()=>{
        if(Math.abs(window.scrollY-startY)<4 && Math.abs(startY-top)>80) window.scrollTo(0, top);
      }, 600);
    };
  });
  syncNavTop();
  updateNavActive();
  // 筛选栏高度可能因字体/换行变化，跟随其尺寸实时同步
  if(window.ResizeObserver && !renderNav._ro){
    renderNav._ro = new ResizeObserver(()=>syncNavTop());
    renderNav._ro.observe(document.querySelector('.filters'));
  }
  window.addEventListener('load', syncNavTop, {once:true});
}

function updateNavActive(){
  const el=document.getElementById('sidenav');
  if(!el || !el.querySelector('.navi')) return;
  const rows = navRows();
  const line = window.scrollY + 150;      // 判定线：视口上方 150px
  let cur = 0;
  rows.forEach((r,i)=>{
    const t=document.querySelector(r.sel);
    if(t && (t.getBoundingClientRect().top + window.scrollY) <= line) cur = i;
  });
  const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
  const hl = atBottom ? rows.length-1 : cur;
  el.querySelectorAll('.navi[data-i]').forEach(a=>{
    a.classList.toggle('on', +a.dataset.i === hl);
  });
}

/* Q4 页面视图：同一份看板，用 URL 的 #q4 切到独立页面；主看板里不占板块流位置。

function applyQ4View(){
  const body = document.body;
  if(!body || !body.classList) return;         // 测试桩等无 body 的环境直接跳过
  const loc = (typeof window!=='undefined' && window.location) ? window.location : {hash:''};
  const h = (loc.hash || '').replace(/^#/,'');
  const now = body.classList.contains('q4-only');
  /* 只有「明确的信号」才切页：q4 / q4c-N（Q4 页内锚点）进 Q4 页；空 hash 回主看板。

     否则目录点击/锚点兜底会把 Q4 页直接踢回主看板。 */
  let on;
  if(/^q4/.test(h)) on = true;
  else if(h==='') on = false;
  else on = now;
  body.classList.toggle('q4-only', on);
  document.title = on ? ('Q4冲销异常 · ' + Q4_TITLE_MAIN) : Q4_TITLE_MAIN;
  if(on && !now) window.scrollTo(0, 0);
  if(_booted && now!==on){
